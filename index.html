    <style>
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #ddd;
        border-top-color: #ffe95c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

  <body>
    <div id="preloader">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <div id="root"></div>
    <script>
      // Function to remove preloader
      function removePreloader() {
        const preloader = document.getElementById("preloader");
        if (preloader) {
          preloader.style.opacity = "0";
          setTimeout(() => preloader.remove(), 300); // fade out
        }
      }

      // Expose globally so React can call it
      window.removePreloader = removePreloader;

      // Fallback: remove after window.load (all resources loaded)
      window.addEventListener("load", () => {
        setTimeout(removePreloader, 100);
      });

      // Safety fallback: remove after 5 seconds no matter what
      setTimeout(removePreloader, 5000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
